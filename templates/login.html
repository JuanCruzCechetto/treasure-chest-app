{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<section class="tarjeta angosta">
  <h1>Ingresar</h1>
  {% if error %}<p class="aviso aviso-error">{{ error }}</p>{% endif %}
  <form method="post" novalidate data-validar="login">
    <label for="nombre">Usuario</label>
    <input id="nombre" name="nombre" value="{{ nombre }}" required autocomplete="username">
    <small class="error" data-error-de="nombre"></small>

    <label for="clave">Contraseña</label>
    <input id="clave" name="clave" type="password" required autocomplete="current-password">
    <small class="error" data-error-de="clave"></small>

    <button class="boton" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
